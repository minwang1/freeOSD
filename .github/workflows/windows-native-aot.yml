name: Windows builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-win-x64-native-aot:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish freeOSD for Windows x64 with Native AOT
        run: >-
          dotnet publish src/MonitorControl.App/MonitorControl.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishAot=true
          -p:StripSymbols=true

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeOSD-win-x64-native-aot
          path: src/MonitorControl.App/bin/Release/net10.0/win-x64/publish/
          if-no-files-found: error
          retention-days: 14

  publish-win-x64-framework-dependent:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish freeOSD for Windows x64 without .NET Runtime
        run: >-
          dotnet publish src/MonitorControl.App/MonitorControl.App.csproj
          --configuration Release
          --runtime win-x64
          --no-self-contained
          -p:PublishAot=false

      - name: Upload framework-dependent artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeOSD-win-x64-framework-dependent
          path: src/MonitorControl.App/bin/Release/net10.0/win-x64/publish/
          if-no-files-found: error
          retention-days: 14
